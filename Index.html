<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Godmode AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0a0a0c; color: #e1e1e6; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 16px; background: #121216; border-bottom: 1px solid #23232a; text-align: center; font-weight: 700; letter-spacing: 1px; color: #fff; }
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .user-msg { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .ai-msg { background: #1c1c24; color: #d1d5db; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #2d2d3a; }
    .status { font-size: 12px; color: #6b7280; text-align: center; margin: 4px 0; }
    footer { padding: 12px 16px; background: #121216; border-top: 1px solid #23232a; display: flex; gap: 8px; }
    input { flex: 1; padding: 12px 16px; background: #1a1a22; border: 1px solid #2d2d3a; border-radius: 24px; color: #fff; font-size: 15px; outline: none; }
    button { background: #2563eb; color: white; border: none; padding: 0 18px; border-radius: 24px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <header>GODMODE AI</header>
  <div id="chat-container">
    <div class="msg ai-msg">Godmode online. Ready to research, invent, and build.</div>
  </div>
  <footer>
    <input type="text" id="userInput" placeholder="Ask anything or request web search..." onkeydown="if(event.key==='Enter') sendQuery()" />
    <button id="sendBtn" onclick="sendQuery()">Send</button>
  </footer>

  <script>
    // YOUR LIVE CLOUDFLARE WORKER URL
    const MY_WORKER_URL = "https://searchproxy.godmodeai600.workers.dev";

    async function sendQuery() {
      const input = document.getElementById('userInput');
      const btn = document.getElementById('sendBtn');
      const query = input.value.trim();
      if (!query) return;

      appendMsg(query, 'user-msg');
      input.value = '';
      btn.disabled = true;

      const statusId = appendStatus("Searching live web...");

      try {
        const response = await fetch(MY_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query })
        });

        const data = await response.json();
        removeStatus(statusId);

        if (data.answer) {
          appendMsg(data.answer, 'ai-msg');
        } else if (data.results && data.results.length > 0) {
          let text = "Search Results:\n\n";
          data.results.forEach((r, i) => {
            text += `${i+1}. ${r.title}\n${r.content}\n\n`;
          });
          appendMsg(text, 'ai-msg');
        } else {
          appendMsg("No detailed answer found.", 'ai-msg');
        }
      } catch (err) {
        removeStatus(statusId);
        appendMsg("Error communicating with search worker. Check connection.", 'ai-msg');
      } finally {
        btn.disabled = false;
      }
    }

    function appendMsg(text, className) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = `msg ${className}`;
      div.innerText = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function appendStatus(text) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      const id = 'status-' + Date.now();
      div.id = id;
      div.className = 'status';
      div.innerText = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return id;
    }

    function removeStatus(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }
  </script>
</body>
</html>
